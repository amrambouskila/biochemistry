name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Stages map to global CLAUDE.md §5: lint → test → coverage gate → build → docker-build.
# Coverage gate is enforced in-tool (pytest --cov-fail-under=100 and Vitest
# thresholds), so "coverage gate" isn't a separate job — a passing test job
# implies a passing gate.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: backend / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  backend-sast:
    name: backend / sast
    runs-on: ubuntu-latest
    needs: [backend-lint]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --extra dev
        working-directory: backend
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-python
      - name: Semgrep
        run: |
          pipx run semgrep scan --config auto --config p/owasp-top-ten --config p/python --config p/docker --severity ERROR --error --sarif --output semgrep-backend.sarif --include backend || echo "SEMGREP_FAILED=1" >> "$GITHUB_ENV"
      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() }}
        with:
          sarif_file: semgrep-backend.sarif
          category: semgrep-backend
      - name: Fail on Semgrep findings
        run: test -z "${SEMGREP_FAILED:-}"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit
        working-directory: backend
        run: uv run --with pip-audit pip-audit

  backend-test:
    name: backend / test + coverage gate
    runs-on: ubuntu-latest
    needs: [backend-sast]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest --junitxml=junit-backend.xml
      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: ${{ !cancelled() }}
        with:
          name: backend tests
          path: backend/junit-backend.xml
          reporter: java-junit

  backend-build:
    name: backend / build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv build

  backend-docker-build:
    name: backend / docker-build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: biochemistry-backend:ci
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: biochemistry-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  frontend-lint:
    name: frontend / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  frontend-sast:
    name: frontend / sast
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    permissions:
      contents: read
      security-events: write
      actions: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-frontend
      - name: Semgrep
        working-directory: .
        run: |
          pipx run semgrep scan --config auto --config p/owasp-top-ten --config p/typescript --config p/react --config p/docker --severity ERROR --error --sarif --output semgrep-frontend.sarif --include frontend || echo "SEMGREP_FAILED=1" >> "$GITHUB_ENV"
      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() }}
        with:
          sarif_file: semgrep-frontend.sarif
          category: semgrep-frontend
      - name: Fail on Semgrep findings
        run: test -z "${SEMGREP_FAILED:-}"
      - name: Dependency audit
        run: pnpm audit --audit-level=high

  frontend-test:
    name: frontend / test + coverage gate
    runs-on: ubuntu-latest
    needs: [frontend-sast]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Reporters + outputFile are configured in vite.config.ts, not passed as
      # CLI flags: pnpm's `-- <args>` forwarding mangles `=` on POSIX shells.
      - run: pnpm test:coverage
      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: ${{ !cancelled() }}
        with:
          name: frontend tests
          path: frontend/junit-frontend.xml
          reporter: java-junit

  frontend-build:
    name: frontend / build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  frontend-docker-build:
    name: frontend / docker-build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: biochemistry-frontend:ci
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: biochemistry-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
